name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts keeps the Electron binary out of CI: the renderer is
      # what this job proves. The lockfile pins Electron itself, so a version
      # bump still shows up as a lockfile diff.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build renderer
        run: npm run build
